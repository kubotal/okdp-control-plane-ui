replicaCount: 1

image:
  repository: quay.io/okdp/images/okdp-ui
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# In-cluster okdp-server Service. The ingress routes /api to it so the browser
# stays same-origin (no CORS). Must resolve in the release namespace.
backend:
  service: okdp-server
  port: 8093

# OIDC provider the console redirects to. Injected at container startup, not
# baked into the bundle, so one image serves any cluster.
oidc:
  authority: ""
  clientId: okdp-ui

# Which claim of the token carries the caller's roles, and which role opens the
# administration screens. Defaults match Keycloak, where realm roles are nested
# under realm_access. Point rolesClaim at a flat claim ("roles", "groups") for a
# provider that publishes one.
identity:
  rolesClaim: realm_access.roles
  adminRole: platform_admin

service:
  type: ClusterIP
  port: 4200

# Public exposure of the console.
ingress:
  className: nginx
  host: console.okdp.sandbox
  clusterIssuer: default-issuer
  tlsSecretName: okdp-ui-tls

resources: {}
