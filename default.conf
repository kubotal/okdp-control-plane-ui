server {
    listen 4200;
    listen [::]:4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No backend in the standalone image: do not fall back to index.html
    # for API paths (the chart proxies /api to okdp-server in-cluster).
    location /api/ {
        return 404;
    }

    # SPA routing: serve index.html for client-side deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
